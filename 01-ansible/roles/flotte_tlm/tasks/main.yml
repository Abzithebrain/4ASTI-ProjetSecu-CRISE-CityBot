---
- name: Paquets
  ansible.builtin.apt: { name: [python3-venv], state: present, update_cache: true }

- name: Utilisateur de service
  ansible.builtin.user: { name: citybot, system: true, shell: /usr/sbin/nologin, create_home: false }

- name: Repertoire
  ansible.builtin.file: { path: /opt/citybot/flotte, state: directory, mode: "0755" }

- name: Environnement Python
  ansible.builtin.pip:
    name: [flask, gunicorn]
    virtualenv: /opt/citybot/venv
    virtualenv_command: "python3 -m venv"

- name: Deposer le serveur de flotte
  ansible.builtin.copy: { src: flotte.py, dest: /opt/citybot/flotte/flotte.py, mode: "0644" }
  notify: restart flotte-tlm

- name: Fichier de journal
  ansible.builtin.file: { path: "{{ citybot_log_dir }}/flotte-tlm.json", state: touch, owner: citybot, mode: "0644" }
  changed_when: false

- name: Service systemd
  ansible.builtin.template: { src: flotte-tlm.service.j2, dest: /etc/systemd/system/flotte-tlm.service, mode: "0644" }
  notify: restart flotte-tlm

- name: Demarrer
  ansible.builtin.systemd: { name: flotte-tlm, state: started, enabled: true, daemon_reload: true }

- name: Verification
  ansible.builtin.uri: { url: "http://127.0.0.1:8080/api/sante" }
  register: v
  retries: 5
  delay: 3
  until: v.status == 200

- name: Etat du serveur de flotte
  ansible.builtin.debug: { msg: "FLOTTE-TLM en ligne, vehicules : {{ v.json.vehicules_connus }}" }
