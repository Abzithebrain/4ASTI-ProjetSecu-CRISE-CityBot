---
- name: Paquets
  ansible.builtin.apt: { name: [nginx, python3-venv, openssl], state: present, update_cache: true }

- name: Utilisateur de service
  ansible.builtin.user: { name: citybot, system: true, shell: /usr/sbin/nologin, create_home: false }

- name: Repertoires
  ansible.builtin.file: { path: "{{ item }}", state: directory, owner: citybot, mode: "0755" }
  loop: [/opt/citybot, /opt/citybot/paiement, /etc/ssl/citybot]

- name: Environnement Python
  ansible.builtin.pip:
    name: [flask, gunicorn]
    virtualenv: /opt/citybot/venv
    virtualenv_command: "python3 -m venv"

- name: Deposer le service
  ansible.builtin.copy: { src: paiement.py, dest: /opt/citybot/paiement/paiement.py, mode: "0644" }
  notify: restart tiers-paiement

- name: Certificat auto-signe
  ansible.builtin.command:
    cmd: >
      openssl req -x509 -nodes -days 825 -newkey rsa:2048
      -keyout /etc/ssl/citybot/paiement.key -out /etc/ssl/citybot/paiement.crt
      -subj "/C=FR/O=Prestataire Paiement/CN=tiers-paiement.citybot.lab"
    creates: /etc/ssl/citybot/paiement.crt

- name: Fichier de journal
  ansible.builtin.file: { path: "{{ citybot_log_dir }}/tiers-paiement.json", state: touch, owner: citybot, mode: "0644" }
  changed_when: false

- name: Service et vhost
  ansible.builtin.template: { src: "{{ item.s }}", dest: "{{ item.d }}", mode: "0644" }
  loop:
    - { s: tiers-paiement.service.j2, d: /etc/systemd/system/tiers-paiement.service }
    - { s: nginx-paiement.j2, d: /etc/nginx/sites-available/paiement }
  notify: [restart tiers-paiement, restart nginx]

- name: Activer le vhost
  ansible.builtin.file: { src: /etc/nginx/sites-available/paiement, dest: /etc/nginx/sites-enabled/paiement, state: link }
  notify: restart nginx

- name: Retirer le site par defaut
  ansible.builtin.file: { path: /etc/nginx/sites-enabled/default, state: absent }
  notify: restart nginx

- name: Demarrer
  ansible.builtin.systemd: { name: "{{ item }}", state: started, enabled: true, daemon_reload: true }
  loop: [tiers-paiement, nginx]

- name: Verification
  ansible.builtin.uri: { url: "https://127.0.0.1/api/sante", validate_certs: false }
  retries: 5
  delay: 3
  register: v
  until: v.status == 200
