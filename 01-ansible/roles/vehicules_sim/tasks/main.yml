---
# Docker est installe DANS la VM (jamais sur l'hote Ludus).
- name: Dependances Docker
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg]
    state: present
    update_cache: true

- name: Cle du depot Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Depot Docker
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
    filename: docker

- name: Moteur Docker
  ansible.builtin.apt:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]
    state: present
    update_cache: true

- name: Service Docker
  ansible.builtin.service: { name: docker, state: started, enabled: true }

- name: Repertoire de deploiement
  ansible.builtin.file: { path: /opt/citybot/flotte-sim, state: directory, mode: "0755" }

- name: Deposer l'agent, la navlib de base et le Dockerfile
  ansible.builtin.copy:
    src: vehicule/
    dest: /opt/citybot/flotte-sim/vehicule/
    mode: "0644"

- name: Rendre l'agent executable
  ansible.builtin.file: { path: /opt/citybot/flotte-sim/vehicule/agent.py, mode: "0755" }

- name: docker-compose des trois vehicules
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/citybot/flotte-sim/docker-compose.yml
    mode: "0644"

- name: Construire et demarrer les vehicules
  community.docker.docker_compose_v2:
    project_src: /opt/citybot/flotte-sim
    build: always
    state: present
  register: dc

- name: Vehicules demarres
  ansible.builtin.debug:
    msg: "Conteneurs : {{ dc.containers | map(attribute='Name') | list | default(['voir docker ps']) }}"

- name: Rediriger les journaux des conteneurs vers le repertoire collecte
  ansible.builtin.copy:
    dest: /etc/rsyslog.d/40-vehicules.conf
    mode: "0644"
    content: |
      # Les journaux Docker sont en json-file ; Filebeat (profil docker) les lit
      # dans /var/lib/docker/containers/*/*.log. Rien a faire ici si Filebeat
      # utilise le module docker. Place-tenant pour une collecte syslog custom.
