---
- name: Paquets
  ansible.builtin.apt:
    name: [nginx, python3-venv, python3-dev, libpq-dev, build-essential, openssl]
    state: present
    update_cache: true

- name: Utilisateur de service
  ansible.builtin.user: { name: citybot, system: true, shell: /usr/sbin/nologin, create_home: false }

- name: Repertoires
  ansible.builtin.file: { path: "{{ item }}", state: directory, mode: "0755" }
  loop: [/opt/citybot, /opt/citybot/app-resa, /etc/ssl/citybot]

- name: Environnement Python
  ansible.builtin.pip:
    name: [flask, gunicorn, psycopg2-binary, requests]
    virtualenv: /opt/citybot/venv
    virtualenv_command: "python3 -m venv"

- name: Deposer l'application
  ansible.builtin.copy: { src: app.py, dest: /opt/citybot/app-resa/app.py, mode: "0644" }
  notify: restart app-resa

- name: Certificat auto-signe
  ansible.builtin.command:
    cmd: >
      openssl req -x509 -nodes -days 825 -newkey rsa:2048
      -keyout /etc/ssl/citybot/app-resa.key -out /etc/ssl/citybot/app-resa.crt
      -subj "/C=FR/O=CityBot Mobility/CN=app-resa.citybot.lab"
    creates: /etc/ssl/citybot/app-resa.crt

- name: Fichiers de journaux accessibles au service
  ansible.builtin.file:
    path: "{{ citybot_log_dir }}/{{ item }}"
    state: touch
    owner: citybot
    mode: "0644"
  loop: [app-resa.json, app-resa-access.log]
  changed_when: false

- name: Service systemd
  ansible.builtin.template: { src: app-resa.service.j2, dest: /etc/systemd/system/app-resa.service, mode: "0644" }
  notify: restart app-resa

- name: Vhost nginx
  ansible.builtin.template: { src: nginx-app-resa.j2, dest: /etc/nginx/sites-available/app-resa, mode: "0644" }
  notify: restart nginx

- name: Activer le vhost
  ansible.builtin.file: { src: /etc/nginx/sites-available/app-resa, dest: /etc/nginx/sites-enabled/app-resa, state: link }
  notify: restart nginx

- name: Retirer le site par defaut
  ansible.builtin.file: { path: /etc/nginx/sites-enabled/default, state: absent }
  notify: restart nginx

- name: Demarrer
  ansible.builtin.systemd: { name: "{{ item }}", state: started, enabled: true, daemon_reload: true }
  loop: [app-resa, nginx]

- name: Verification
  ansible.builtin.uri: { url: "https://127.0.0.1/api/sante", validate_certs: false }
  register: v
  retries: 5
  delay: 3
  until: v.status == 200

- name: Resultat
  ansible.builtin.debug: { msg: "APP-RESA repond : {{ v.json }}" }
